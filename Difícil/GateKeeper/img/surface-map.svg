<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <rect width="1000" height="620" fill="#0d1117"/>
  <text x="500" y="40" fill="#58a6ff" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle">Superficie de Ataque — 172.17.0.2</text>

  <!-- nodo objetivo -->
  <rect x="360" y="70" width="280" height="60" rx="10" fill="#1f3a5f" stroke="#58a6ff" stroke-width="2"/>
  <text x="500" y="98" fill="#c9d1d9" font-family="monospace" font-size="16" text-anchor="middle">172.17.0.2</text>
  <text x="500" y="118" fill="#8b949e" font-family="monospace" font-size="13" text-anchor="middle">metasploitable.vm</text>

  <!-- lineas a puertos -->
  <line x1="420" y1="130" x2="200" y2="190" stroke="#3fb950" stroke-width="2"/>
  <line x1="480" y1="130" x2="350" y2="190" stroke="#8b949e" stroke-width="2"/>
  <line x1="530" y1="130" x2="650" y2="190" stroke="#8b949e" stroke-width="2"/>
  <line x1="590" y1="130" x2="810" y2="190" stroke="#d29922" stroke-width="3" stroke-dasharray="10,5"/>

  <!-- puerto 80 -->
  <rect x="60" y="190" width="260" height="130" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="80" y="215" fill="#3fb950" font-family="monospace" font-size="16" font-weight="bold">80/tcp — Apache 2.4.52</text>
  <text x="80" y="240" fill="#c9d1d9" font-family="monospace" font-size="13">/index.php — landing (estática)</text>
  <text x="80" y="260" fill="#c9d1d9" font-family="monospace" font-size="13">/admin/ — under construction</text>
  <text x="80" y="280" fill="#d29922" font-family="monospace" font-size="13">/backups/ — listado habilitado</text>
  <text x="80" y="305" fill="#8b949e" font-family="monospace" font-size="12">→ /backups/.env (semilla knock)</text>

  <!-- 3306 decoy -->
  <rect x="345" y="190" width="230" height="110" rx="8" fill="#2d1c1c" stroke="#f85149" stroke-width="2"/>
  <text x="360" y="215" fill="#f85149" font-family="monospace" font-size="16" font-weight="bold">3306/tcp — SEÑUELO</text>
  <text x="360" y="240" fill="#c9d1d9" font-family="monospace" font-size="12">"Access denied" sin</text>
  <text x="360" y="256" fill="#c9d1d9" font-family="monospace" font-size="12">handshake de versión</text>
  <text x="360" y="278" fill="#8b949e" font-family="monospace" font-size="12">no valida credenciales</text>

  <!-- 5432 decoy -->
  <rect x="600" y="190" width="230" height="110" rx="8" fill="#2d1c1c" stroke="#f85149" stroke-width="2"/>
  <text x="615" y="215" fill="#f85149" font-family="monospace" font-size="16" font-weight="bold">5432/tcp — SEÑUELO</text>
  <text x="615" y="240" fill="#c9d1d9" font-family="monospace" font-size="12">"FATAL: password auth</text>
  <text x="615" y="256" fill="#c9d1d9" font-family="monospace" font-size="12">failed" sin startup</text>
  <text x="615" y="278" fill="#8b949e" font-family="monospace" font-size="12">rechaza antes de handshake</text>

  <!-- 33333 SSH -->
  <rect x="680" y="340" width="260" height="140" rx="8" fill="#1c2d1c" stroke="#3fb950" stroke-width="2"/>
  <text x="695" y="365" fill="#3fb950" font-family="monospace" font-size="16" font-weight="bold">33333/tcp — SSH (filtrado)</text>
  <text x="695" y="390" fill="#c9d1d9" font-family="monospace" font-size="12">OpenSSH_8.9p1 Ubuntu</text>
  <text x="695" y="412" fill="#d29922" font-family="monospace" font-size="12">requiere knock previo:</text>
  <text x="695" y="430" fill="#d29922" font-family="monospace" font-size="13">1337 → 2048 → 4096</text>
  <text x="695" y="455" fill="#8b949e" font-family="monospace" font-size="12">post-knock: user,pass,key</text>

  <!-- nota decoy log -->
  <rect x="60" y="350" width="280" height="130" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="75" y="375" fill="#c9d1d9" font-family="monospace" font-size="14" font-weight="bold">/backups/.backup</text>
  <text x="75" y="398" fill="#8b949e" font-family="monospace" font-size="12">audit log con 27 usuarios</text>
  <text x="75" y="418" fill="#8b949e" font-family="monospace" font-size="12">(26 son señuelo)</text>
  <text x="75" y="442" fill="#3fb950" font-family="monospace" font-size="12">"mauricio" = real</text>
  <text x="75" y="462" fill="#8b949e" font-family="monospace" font-size="12">→ foothold</text>
</svg>
