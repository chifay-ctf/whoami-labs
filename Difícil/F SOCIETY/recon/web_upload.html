<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E Corp - Employee Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .upload-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
        }
        .upload-box {
            background-color: #1a1a1a;
            border: 3px solid #ff0000;
            padding: 3rem;
            max-width: 600px;
            width: 100%;
            margin: 2rem;
        }
        .upload-title {
            font-size: 2rem;
            color: #ff0000;
            text-align: center;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-label {
            display: block;
            color: #cccccc;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }
        .form-control {
            width: 100%;
            padding: 1rem;
            background-color: #333333;
            border: 2px solid #ff0000;
            color: #ffffff;
            font-family: 'Courier Prime', monospace;
        }
        .btn-submit {
            width: 100%;
            padding: 1rem;
            background-color: #ff0000;
            color: #ffffff;
            border: 2px solid #ff0000;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        .btn-submit:hover {
            background-color: transparent;
            box-shadow: 0 0 20px #ff0000;
        }
        .alert {
            padding: 1rem;
            margin-bottom: 1.5rem;
            border: 2px solid;
            text-align: center;
        }
        .alert-error {
            border-color: #ff0000;
            background-color: rgba(255, 0, 0, 0.1);
            color: #ff0000;
        }
        .alert-success {
            border-color: #00ff00;
            background-color: rgba(0, 255, 0, 0.1);
            color: #00ff00;
        }
        .back-link {
            text-align: center;
            margin-top: 2rem;
        }
        .back-link a {
            color: #ff0000;
            text-decoration: none;
        }
        .info-text {
            color: #666;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="glitch-overlay"></div>
    <div class="scanlines"></div>
    
    <div class="upload-container">
        <div class="upload-box">
            <h1 class="upload-title">[EMPLOYEE FILE UPLOAD]</h1>
            
                        
                        
            <form method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label class="form-label">SELECT FILE</label>
                    <input type="file" name="file" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <button type="submit" class="btn-submit">UPLOAD FILE</button>
                </div>
            </form>
            
            <p class="info-text">Allowed file types: JPG, PNG, GIF, PDF, TXT</p>
            
            <div class="back-link">
                <a href="index.html">← RETURN TO HOMEPAGE</a>
            </div>
        </div>
    </div>
</body>
</html>
